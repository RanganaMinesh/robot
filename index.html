<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DuckBot Android Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #050508;
      color: #fff;
      font-family: monospace;
      min-height: 100vh;
      min-height: 100svh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-y: auto; 
      overflow-x: hidden;
      padding: 1.5rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
    }

    #face-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      min-height: 220px;
    }
    
    .eye {
      width: 75px;
      height: 120px;
      background: #00ffcc;
      border-radius: 40px;
      box-shadow: 0 0 25px #00ffcc, inset 0 0 15px #ffffff;
      transition: all 0.15s ease-in-out;
    }
    .blink {
      height: 4px !important;
      margin-top: 58px;
    }
    .thinking {
      background: #ffaa00 !important;
      box-shadow: 0 0 25px #ffaa00 !important;
      animation: pulse 0.8s infinite alternate;
    }
    .speaking {
      background: #0088ff !important;
      box-shadow: 0 0 25px #0088ff !important;
    }
    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    #controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 15px;
    }
    .row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    input, button {
      padding: 14px;
      background: #1a1a24;
      border: 1px solid #33334d;
      color: #00ffcc;
      border-radius: 8px;
      font-size: 14px;
      min-height: 48px;
    }
    button {
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
    }
    button:active { background: #00ffcc; color: #000; }
    #status-log {
      font-size: 12px;
      color: #8888aa;
      min-height: 40px;
      overflow-y: auto;
      white-space: pre-wrap;
      text-align: center;
    }
    video, canvas { display: none; }
  </style>
</head>
<body>

  <div id="face-container">
    <div class="eye" id="eye-left"></div>
    <div class="eye" id="eye-right"></div>
  </div>

  <div id="controls">
    <div id="status-log">Tap 'Start Sensors' to activate camera & mic.</div>
    <div class="row">
      <!-- HARDCODED AQ AUTH KEY -->
      <input type="password" id="apiKey" value="AQ.Ab8RN6JF_A2Da8TnyBU1vLcxUSMCCUym6mQq11km4nC0ssr-1A" style="flex: 2;">
      <button onclick="initSensors()" style="flex: 1;">Start Sensors</button>
    </div>
    <div class="row">
      <button onclick="connectBluetooth()" style="flex: 1;">Pair ESP32</button>
      <button onclick="triggerVoiceInput()" style="flex: 1; background: #00ffcc; color: #000;">🎤 Speak</button>
    </div>
  </div>

  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="snapshot-canvas" width="640" height="480"></canvas>

  <script>
    const eyeL = document.getElementById('eye-left');
    const eyeR = document.getElementById('eye-right');
    const statusLog = document.getElementById('status-log');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('snapshot-canvas');
    let bleCharacteristic = null;

    function blink() {
      eyeL.classList.add('blink');
      eyeR.classList.add('blink');
      setTimeout(() => {
        eyeL.classList.remove('blink');
        eyeR.classList.remove('blink');
      }, 180);
      setTimeout(blink, Math.random() * 4000 + 2000);
    }
    blink();

    function setMood(mood) {
      eyeL.className = 'eye ' + mood;
      eyeR.className = 'eye ' + mood;
    }

    async function initSensors() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusLog.innerText = "Camera & Speech engine active.";
      } catch (err) {
        statusLog.innerText = "Camera Error: " + err.message;
      }
    }

    async function connectBluetooth() {
      try {
        statusLog.innerText = "Searching for ESP32 BLE device...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'DuckBot' }],
          optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
        bleCharacteristic = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
        statusLog.innerText = "Connected to ESP32 over BLE!";
      } catch (err) {
        statusLog.innerText = "BLE Connect failed: " + err.message;
      }
    }

    function sendMotorCommand(cmd) {
      if (!bleCharacteristic) {
        console.log("BLE not connected. Command would be:", cmd);
        return;
      }
      const encoder = new TextEncoder();
      bleCharacteristic.writeValue(encoder.encode(cmd));
    }

    function triggerVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition not supported. Use Chrome on Android.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        setMood('');
        statusLog.innerText = "Listening...";
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        statusLog.innerText = `Heard: "${transcript}"`;
        processMultimodalQuery(transcript);
      };

      recognition.onerror = (e) => {
        statusLog.innerText = "Mic Error: " + e.error;
      };

      recognition.start();
    }

    async function processMultimodalQuery(userText) {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        statusLog.innerText = "Error: API key is missing.";
        return;
      }

      setMood('thinking');
      statusLog.innerText = "Processing vision & query...";

      // Grab camera frame
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

      const requestPayload = {
        system_instruction: {
          parts: [{ text: "You are DuckBot, a small intelligent mobile robot. You can see through your front camera. Reply concisely in a friendly tone. When instructed to move, end your reply with one tag: [CMD:FORWARD], [CMD:BACKWARD], [CMD:LEFT], [CMD:RIGHT], or [CMD:STOP]." }]
        },
        contents: [{
          parts: [
            { text: userText },
            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
          ]
        }]
      };

      try {
        // Uses gemini-2.0-flash with both header and query param authentication
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-goog-api-key': apiKey
          },
          body: JSON.stringify(requestPayload)
        });

        const data = await response.json();

        if (data.error) {
          setMood('');
          statusLog.innerText = `Google Error (${data.error.code}): ${data.error.message}`;
          return;
        }

        if (!data.candidates || data.candidates.length === 0) {
          setMood('');
          statusLog.innerText = "Error: No response generated.";
          return;
        }

        const replyPart = data.candidates[0].content?.parts?.[0];
        if (!replyPart || !replyPart.text) {
          setMood('');
          statusLog.innerText = "Error: Response content format unexpected.";
          return;
        }

        handleRobotResponse(replyPart.text);
      } catch (err) {
        setMood('');
        statusLog.innerText = "Fetch Exception: " + err.message;
      }
    }

    function handleRobotResponse(rawReply) {
      setMood('speaking');

      const match = rawReply.match(/\[CMD:(FORWARD|BACKWARD|LEFT|RIGHT|STOP)\]/);
      let cleanText = rawReply.replace(/\[CMD:\w+\]/g, '').trim();

      if (match) {
        const cmd = match[1];
        statusLog.innerText = `Action: ${cmd}\n"${cleanText}"`;
        sendMotorCommand(cmd.charAt(0));
      } else {
        statusLog.innerText = `"${cleanText}"`;
      }

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.onend = () => setMood('');
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
