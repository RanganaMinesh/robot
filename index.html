<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DuckBot Android Core</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #050508;
      color: #fff;
      font-family: monospace;
      min-height: 100vh;
      min-height: 100svh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-y: auto; 
      overflow-x: hidden;
      padding: 1.5rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
    }

    #face-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      min-height: 220px;
    }
    
    .eye {
      width: 75px;
      height: 120px;
      background: #00ffcc;
      border-radius: 40px;
      box-shadow: 0 0 25px #00ffcc, inset 0 0 15px #ffffff;
      transition: all 0.15s ease-in-out;
    }
    .blink {
      height: 4px !important;
      margin-top: 58px;
    }
    .thinking {
      background: #ffaa00 !important;
      box-shadow: 0 0 25px #ffaa00 !important;
      animation: pulse 0.8s infinite alternate;
    }
    .speaking {
      background: #00ff66 !important;
      box-shadow: 0 0 25px #00ff66 !important;
    }
    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    #controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 15px;
    }
    .row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    input, button {
      padding: 14px;
      background: #1a1a24;
      border: 1px solid #33334d;
      color: #00ffcc;
      border-radius: 8px;
      font-size: 14px;
      min-height: 48px;
    }
    button {
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
    }
    button:active { background: #00ffcc; color: #000; }
    #status-log {
      font-size: 12px;
      color: #8888aa;
      min-height: 40px;
      overflow-y: auto;
      white-space: pre-wrap;
      text-align: center;
    }
    video, canvas { display: none; }
  </style>
</head>
<body>

  <div id="face-container">
    <div class="eye" id="eye-left"></div>
    <div class="eye" id="eye-right"></div>
  </div>

  <div id="controls">
    <div id="status-log">Tap 'Start Sensors' once to begin hands-free mode.</div>
    <div class="row">
      <input type="password" id="apiKey" value="AQ.Ab8RN6LccBr62gtjbwxDtvfTipyLtkhLASzrKY1WXXfBfWhMMQ" style="flex: 2;">
      <button onclick="initSensors()" id="startBtn" style="flex: 1; background: #00ffcc; color: #000;">Start Sensors</button>
    </div>
    <div class="row">
      <button onclick="connectBluetooth()" style="flex: 1;">Pair ESP32</button>
    </div>
  </div>

  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="snapshot-canvas" width="640" height="480"></canvas>

  <script>
    const eyeL = document.getElementById('eye-left');
    const eyeR = document.getElementById('eye-right');
    const statusLog = document.getElementById('status-log');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('snapshot-canvas');
    let bleCharacteristic = null;

    let recognition = null;
    let isListeningActive = false;
    let isProcessing = false;
    let isSpeaking = false;

    function blink() {
      if (!isProcessing) {
        eyeL.classList.add('blink');
        eyeR.classList.add('blink');
        setTimeout(() => {
          eyeL.classList.remove('blink');
          eyeR.classList.remove('blink');
        }, 180);
      }
      setTimeout(blink, Math.random() * 4000 + 2000);
    }
    blink();

    function setMood(mood) {
      eyeL.className = 'eye ' + mood;
      eyeR.className = 'eye ' + mood;
    }

    async function initSensors() {
      try {
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const unlockUtterance = new SpeechSynthesisUtterance("DuckBot ready.");
          unlockUtterance.volume = 0.8;
          window.speechSynthesis.speak(unlockUtterance);
        }, 50);

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        document.getElementById('startBtn').innerText = "Active (Hands-free)";
        document.getElementById('startBtn').style.background = "#1a1a24";
        document.getElementById('startBtn').style.color = "#00ffcc";

        startContinuousListening();
        statusLog.innerText = 'Listening: Say "Hey Duck" or "Robot"...';
      } catch (err) {
        statusLog.innerText = "Init Error: " + err.message;
      }
    }

    function startContinuousListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Web Speech API not supported.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListeningActive = true;
        if (!isProcessing && !isSpeaking) {
          setMood('');
          statusLog.innerText = 'Listening: Say "Hey Duck" or "Robot"...';
        }
      };

      recognition.onresult = (event) => {
        if (isProcessing || isSpeaking) return;

        const lastIndex = event.results.length - 1;
        const text = event.results[lastIndex][0].transcript.trim();
        const lower = text.toLowerCase();
        
        const wakeWords = ["duck", "hey duck", "robot", "hey robot"];
        const matched = wakeWords.find(w => lower.includes(w));

        if (matched) {
          // Wake word detected
          let cleanQuery = lower.substring(lower.indexOf(matched) + matched.length).replace(/^[,\s]+/, '');
          if (!cleanQuery) cleanQuery = "Hello! What can you see right now?";

          recognition.stop();
          processMultimodalQuery(cleanQuery);
        } else {
          // No wake word - tell the user it was ignored
          statusLog.innerText = `Ignored (No wake word): "${text}"\nTry: "Hey Duck, ${text}"`;
        }
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech' && event.error !== 'aborted') {
          console.warn("Speech Error:", event.error);
        }
      };

      recognition.onend = () => {
        isListeningActive = false;
        if (!isSpeaking && !isProcessing) {
          setTimeout(() => { try { recognition.start(); } catch (e) {} }, 300);
        }
      };

      try { recognition.start(); } catch (e) {}
    }

    async function processMultimodalQuery(userText) {
      isProcessing = true;
      const apiKey = document.getElementById('apiKey').value.trim();

      setMood('thinking');
      statusLog.innerText = `Thinking: "${userText}"...`;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

      const requestPayload = {
        system_instruction: {
          parts: [{ text: "You are DuckBot, a small intelligent mobile companion robot. You see through your front camera. Reply concisely in one or two sentences maximum in an enthusiastic, friendly tone. If asked to move or search, end your reply with one tag: [CMD:FORWARD], [CMD:BACKWARD], [CMD:LEFT], [CMD:RIGHT], or [CMD:STOP]." }]
        },
        contents: [{
          parts: [
            { text: userText },
            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
          ]
        }]
      };

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-goog-api-key': apiKey
          },
          body: JSON.stringify(requestPayload)
        });

        const data = await response.json();

        if (data.error) {
          handleRobotResponse(`Error: ${data.error.message}`);
          return;
        }

        const parts = data.candidates?.[0]?.content?.parts || [];
        const textPart = parts.find(p => p.text && !p.thought) || parts[parts.length - 1];
        const replyText = textPart?.text || "I didn't catch that clearly.";

        handleRobotResponse(replyText);
      } catch (err) {
        handleRobotResponse("Network connection failed.");
      }
    }

    function handleRobotResponse(rawReply) {
      isProcessing = false;
      isSpeaking = true;
      setMood('speaking');

      const match = rawReply.match(/\[CMD:(FORWARD|BACKWARD|LEFT|RIGHT|STOP)\]/);
      let cleanText = rawReply.replace(/\[CMD:\w+\]/g, '').trim();

      if (match) {
        const cmd = match[1];
        sendMotorCommand(cmd.charAt(0));
      }

      statusLog.innerText = `DuckBot: "${cleanText}"`;

      // Cancel stuck audio, but wait 100ms before speaking (Android Bug Fix)
      window.speechSynthesis.cancel();
      
      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 1.0;
        utterance.pitch = 1.1; 

        utterance.onend = () => {
          isSpeaking = false;
          setMood('');
          statusLog.innerText = 'Ready. Say "Hey Duck" or "Robot"...';
          setTimeout(() => { try { recognition.start(); } catch (e) {} }, 400);
        };

        utterance.onerror = (e) => {
          isSpeaking = false;
          setMood('');
          try { recognition.start(); } catch (err) {}
        };

        window.speechSynthesis.speak(utterance);
      }, 100);
    }

    async function connectBluetooth() {
      try {
        statusLog.innerText = "Searching for ESP32 BLE device...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'DuckBot' }],
          optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
        bleCharacteristic = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
        statusLog.innerText = "Connected to ESP32 over BLE!";
      } catch (err) {
        statusLog.innerText = "BLE failed: " + err.message;
      }
    }

    function sendMotorCommand(cmd) {
      if (!bleCharacteristic) {
        console.log("Hardware offline. Motor command simulated:", cmd);
        return;
      }
      const encoder = new TextEncoder();
      bleCharacteristic.writeValue(encoder.encode(cmd));
    }
  </script>
</body>
</html>
