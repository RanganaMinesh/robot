<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Robot Controller</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 10px; border: 2px solid #4CAF50; margin-bottom: 20px; transform: scaleX(-1); }
        button { background: #4CAF50; color: white; border: none; padding: 15px 20px; font-size: 16px; margin: 10px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 18px; color: #aaa; }
    </style>
</head>
<body>

    <h2>Robot Vision & AI</h2>
    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <br>
    <button id="pairBtn" onclick="connectBLE()">Pair ESP32</button>
    <button id="listenBtn" onclick="startListening()">🎤 Tap to Speak</button>
    
    <div id="status">Status: Waiting to pair...</div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const statusTxt = document.getElementById('status');
        let rxCharacteristic = null;

        // 1. Start Camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusTxt.innerText = "Camera error: " + err; });

        // 2. Bluetooth Connection
        async function connectBLE() {
            try {
                statusTxt.innerText = "Requesting Bluetooth Device...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'AI_ROBOT_ESP32' }],
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                rxCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                statusTxt.innerText = "✅ Connected to Robot!";
                document.getElementById('pairBtn').style.display = 'none';
            } catch (error) {
                statusTxt.innerText = "BLE Error: " + error;
            }
        }

        async function sendCommand(cmd) {
            if (!rxCharacteristic) return;
            const encoder = new TextEncoder();
            await rxCharacteristic.writeValue(encoder.encode(cmd));
        }

        // 3. Speech Recognition & AI Trigger
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';

        function startListening() {
            statusTxt.innerText = "Listening...";
            recognition.start();
        }

        recognition.onresult = async (event) => {
            const prompt = event.results[0][0].transcript;
            statusTxt.innerText = `You said: "${prompt}"\nThinking...`;

            // Capture image
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            // Send to PHP Backend
            try {
                const response = await fetch('process_ai.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, image: imageBase64 })
                });
                
                const data = await response.json();
                statusTxt.innerText = `AI: ${data.speech_reply}\nAction: ${data.robot_command} for ${data.duration_ms}ms`;

                // Speak reply
                const utterance = new SpeechSynthesisUtterance(data.speech_reply);
                window.speechSynthesis.speak(utterance);

                // Execute Robot Move
                await sendCommand(data.robot_command);
                setTimeout(() => {
                    sendCommand('S'); // Stop after duration
                }, data.duration_ms);

            } catch (error) {
                statusTxt.innerText = "AI Error: " + error;
            }
        };
    </script>
</body>
</html>
